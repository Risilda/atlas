<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Checkpoint not found · ATLAS</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#100D0A">
<style>
:root{--bg:#100D0A;--ink:#EFE7D9;--mut:#9C9083;--acc:#FF6B35;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--serif:"Fraunces",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px}
code{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:22px}
h1{font-size:clamp(2.4rem,8vw,5rem);font-weight:900;letter-spacing:-.02em;line-height:1}
p{color:var(--mut);margin:18px auto 30px;max-width:44ch;line-height:1.6;font-style:italic}
a{font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:#160b05;background:var(--acc);text-decoration:none;padding:14px 26px;border-radius:999px}
a:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<main>
  <code>error 404 · checkpoint not found</code>
  <h1>This release doesn't exist… yet.</h1>
  <p>Atlas has moved on to a newer build. Roll back to the latest stable version instead.</p>
  <a href="/">← return to production</a>
</main>
</body>
</html>
